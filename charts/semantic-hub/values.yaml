nameOverride:
fullnameOverride:
# enables the default keycloak identity provider
enableKeycloak: false

hub:
  image:
    registry: docker.io
    repository: tractusx/sldt-semantic-hub
    # This version property overwrites the default image version. The default image version is the appVersion of the Chart.yaml.
    version: ""
  imagePullPolicy: IfNotPresent
  replicaCount: 1
  containerPort: 4242
  ## Use in-memory triple store that is not persistent
  embeddedTripleStore: false
  host: minikube
  ## If 'authentication' is set to false, no OAuth authentication is enforced
  authentication: false
  # Issuer url for the hub (resource server),
  # make sure that the url points to an externally resolvable hostname.
  # If no value is committed, and the integrated Keycloak is enabled,
  # the K8s internal service name is used, which is a problem, when
  # validating the issuer claim in an access token
  idpIssuerUri: ""
  idpClientId: default-client
  ## Ignored if 'graphdb.enabled' is set to true
  graphdbBaseUrl: http://graphdb:3030
  service:
    port: 8080
    type: ClusterIP
  livenessProbe:
    failureThreshold: 3
    periodSeconds: 3
    initialDelaySeconds: 100
  readinessProbe:
    failureThreshold: 3
    periodSeconds: 3
    initialDelaySeconds: 100
  ingress:
    ## Enable ingress for the Semantic Hub
    enabled: false
    ## Enable TLS (e.g. by using cert-manager)
    tls: true
    ## The secret name that contains the necessary 'tls.crt' and 'tls.key' entries
    ## When using cert-manager this secret is created automatically
    tlsSecretName: ""
    urlPrefix: /semantics/hub
    className: ""
    annotations: []
  resources:
    limits:
      cpu: 750m
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 1024Mi

graphdb:
  ## Include Fuski deployment or deploy separately
  enabled: false
  image: jena-fuseki-docker:5.3.0
  imagePullPolicy: IfNotPresent
  replicaCount: 1
  containerPort: 3030
  queryEndpoint: query
  updateEndpoint: update
  username: admin
  password:
  javaOptions: "-Xmx1048m -Xms1048m"
  args: ["--tdb2", "--update", "--loc", "databases/", "/ds"]
  storageClassName: default
  storageSize: 50Gi
  pvcAccessModes:
    - ReadWriteOnce
  resources:
    limits:
      memory: "1024Mi"
    requests:
      memory: "512Mi"
  service:
    port: 3030

# Minimal in-chart Keycloak deployment, intended for development and
# testing only (gated by 'enableKeycloak'). It runs the official Keycloak
# image in dev mode ('start-dev') with the embedded H2 store and imports a
# pre-configured default realm (config/default-realm-import.json) on startup,
# containing a test client and user with the necessary roles to authorize
# requests to the semantic hub. For production, disable it and configure an
# external identity provider via 'hub.idpIssuerUri'.
keycloak:
  image:
    registry: quay.io
    repository: keycloak/keycloak
    tag: 26.6.3
  imagePullPolicy: IfNotPresent
  auth:
    adminUser: admin
    adminPassword: admin
  containerPort: 8080
  service:
    type: ClusterIP
    # The default issuer URI of the hub
    # (http://hub-keycloak/realms/default-realm) expects port 80
    port: 80
  resources:
    limits:
      cpu: 750m
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 512Mi
